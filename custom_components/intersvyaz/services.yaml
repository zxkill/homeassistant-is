open_door:
  name: Открыть домофон
  description: Открывает выбранный домофон Интерсвязи. Если домофон не указан, используется основной.
  fields:
    entry_id:
      name: Аккаунт Интерсвязи
      description: Запись интеграции Intersvyaz.
      required: true
      selector:
        config_entry:
          integration: intersvyaz
    door_uid:
      name: Домофон
      description: Внутренний UID домофона. Не указывайте для основного домофона.
      required: false
      selector:
        text:

add_known_face:
  name: Добавить известное лицо
  description: Добавляет одно или несколько лиц в локальную базу распознавания.
  fields:
    entry_id:
      name: Аккаунт Интерсвязи
      required: true
      selector:
        config_entry:
          integration: intersvyaz
    name:
      name: Имя
      description: Используется при одиночном добавлении.
      required: false
      selector:
        text:
    person_entity_id:
      name: Человек Home Assistant
      description: Необязательная сущность Person, с которой нужно связать распознаваемое лицо.
      required: false
      selector:
        entity:
          domain: person
    image_url:
      name: URL фотографии
      description: HTTPS/HTTP URL изображения для одиночного добавления.
      required: false
      selector:
        text:
          type: url
    image_base64:
      name: Фотография в base64
      description: Альтернатива image_url для одиночного добавления.
      required: false
      selector:
        text:
          multiline: true
    faces:
      name: Несколько лиц
      description: Список объектов с name и/или person_entity_id + ровно один из image_url/image_base64.
      required: false
      example: |
        - person_entity_id: "person.aleksei"
          image_url: "https://example.org/alexey.jpg"
        - name: "Мария"
          image_base64: "/9j/4AAQSk..."
      selector:
        object:

remove_known_face:
  name: Удалить известное лицо
  description: Удаляет лицо из локальной базы распознавания.
  fields:
    entry_id:
      name: Аккаунт Интерсвязи
      required: true
      selector:
        config_entry:
          integration: intersvyaz
    name:
      name: Имя
      description: Для старых сценариев; можно вместо этого указать человека Home Assistant.
      required: false
      selector:
        text:
    person_entity_id:
      name: Человек Home Assistant
      description: Сущность Person, чьё лицо нужно удалить из локальной базы.
      required: false
      selector:
        entity:
          domain: person
